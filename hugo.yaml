baseURL: https://www.jeffkafka.top/
languageCode: zh-cn
title: Ryou's Blog
theme: hugo-theme-stack
enableRobotsTXT: true
canonifyURLs: false
# Pagination configuration
pagination:
    pagerSize: 5

params:
    sidebar:
        avatar: img/avatar_cat.png

    article:
        viewCount: true

    widgets:
        page:
            - type: toc

    comments:
        enabled: true
        provider: giscus
        giscus:
            repo: WASIDJ/wasidj.github.io
            repoID: R_kgDOQ6dAPA
            category: Announcements
            categoryID: DIC_kwDOQ6dAPM4C1ERt
            mapping: pathname
            strict: 0
            reactionsEnabled: 1
            emitMetadata: 0
            inputPosition: bottom
            lightTheme: light
            darkTheme: dark_dimmed
            lang: zh-CN
            loading: lazy

menu:
    social:
        - identifier: github
          name: GitHub
          url: https://github.com/WASIDJ
          params:
              icon: brand-github
              newTab: true

        - identifier: bilibili
          name: Bilibili
          url: https://space.bilibili.com/354814866
          params:
              icon: brand-bilibili
              newTab: true

        - identifier: email
          name: Email
          url: mailto:qaqnoname@163.com
          params:
              icon: mail
              newTab: true

        - identifier: wechat
          name: WeChat
          url: /images/wechat-qr.svg
          params:
              icon: brand-wechat
              newTab: true
              qr: true

# Site-specific behavior is implemented through root-level overrides.
