name: Build and deploy Ryou workspace
on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [blog-content-updated]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: workspace-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - name: Pin current published content
        if: github.event_name != 'pull_request'
        env:
          CONTENT_SHA: ${{ github.event.client_payload.sha }}
        run: |
          git -C content fetch origin main
          if [[ "${{ github.event_name }}" == 'repository_dispatch' ]]; then
            if [[ ! "$CONTENT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo 'Missing or invalid content SHA'
              exit 1
            fi
            git -C content cat-file -e "$CONTENT_SHA^{commit}"
            git -C content merge-base --is-ancestor "$CONTENT_SHA" origin/main
          fi
          # Pin once at build start. Late dispatch events cannot restore older content.
          git -C content checkout --detach origin/main
          git -C content rev-parse HEAD
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install browser
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Save browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-failure-${{ github.sha }}
          path: test-results
      - name: Save preview and rollback artifact
        uses: actions/upload-artifact@v4
        with:
          name: workspace-${{ github.sha }}
          path: out
          include-hidden-files: true
      - name: Deploy static export
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGE_ACTION_TOKEN }}
          external_repository: WASIDJ/wasidj.github.io
          publish_branch: main
          publish_dir: out
          commit_message: "deploy: Next.js workspace ${{ github.sha }}"
